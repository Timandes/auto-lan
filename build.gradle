plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Local'
        url = uri('local-maven')
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.register("runAutoLanPortResolverTest", JavaExec) {
    group = "verification"
    description = "Runs AutoLanPortResolver main-method tests."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.imgalvin.AutoLanPortResolverTest"
}

tasks.register("runAutoLanPublisherTest", JavaExec) {
    group = "verification"
    description = "Runs AutoLanPublisher main-method tests."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.imgalvin.AutoLanPublisherTest"
}

check {
    dependsOn runAutoLanPortResolverTest, runAutoLanPublisherTest
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
